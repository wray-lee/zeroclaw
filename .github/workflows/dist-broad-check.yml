name: dist-broad image check (non-publishing)

on:
  push:
    branches: [ci/dist-broad-check-v086]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platforms }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The two single-platform jobs give per-architecture time and memory;
        # the combined job mirrors docker-publish.yml, which builds both
        # platforms of a tag in one ubuntu-latest job with a 60-minute budget.
        platforms: [linux/amd64, linux/arm64, "linux/amd64,linux/arm64"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read the generated dist-broad tag spec
        id: spec
        run: |
          echo "tested revision (combined): $(git rev-parse HEAD^)"
          # Same generator output the publish workflow consumes:
          # dev/ci/docker-tags.toml is generated by `cargo generate installers`.
          json="$(yq -o=json -I=0 '.tags' dev/ci/docker-tags.toml)"
          spec="$(jq -c 'map(select(.stem == "dist-broad")) | .[0]' <<<"$json")"
          flags="$(jq -r '.flags // ""' <<<"$spec")"
          lto="$(jq -r '.lto // ""' <<<"$spec")"
          cgu="$(jq -r '.codegen_units // ""' <<<"$spec")"
          test -n "$flags" && test -n "$lto" && test -n "$cgu"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "lto=$lto" >> "$GITHUB_OUTPUT"
          echo "cgu=$cgu" >> "$GITHUB_OUTPUT"
          echo "spec: stem=dist-broad lto=$lto codegen_units=$cgu"
          echo "env: platforms=$PLATFORMS $(nproc) CPUs, $(free -m | awk '/Mem/{print $2}') MiB RAM, $(docker --version)"
        env:
          PLATFORMS: ${{ matrix.platforms }}

      - uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile (release target, no push)
        env:
          FLAGS: ${{ steps.spec.outputs.flags }}
          LTO: ${{ steps.spec.outputs.lto }}
          CGU: ${{ steps.spec.outputs.cgu }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          (while sleep 10; do free -m | awk '/Mem/{print $3}' >> /tmp/mem.log; done) &
          load=""
          case "$PLATFORMS" in *,*) ;; *) load="--load" ;; esac
          t0=$(date +%s)
          set +e
          docker buildx build --platform "$PLATFORMS" -f Dockerfile --target release \
            --build-arg "ZEROCLAW_CARGO_FLAGS=$FLAGS" \
            --build-arg "ZEROCLAW_RELEASE_LTO=$LTO" \
            --build-arg "ZEROCLAW_RELEASE_CODEGEN_UNITS=$CGU" \
            --build-arg "ZEROCLAW_BUILD_ID=$(git rev-parse HEAD^)" \
            -t zeroclaw-dist-broad:check $load . 2>&1 | tee /tmp/build.log | tail -40
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          echo "RESULT platforms=$PLATFORMS exit=$rc elapsed=$(( (t1-t0)/60 ))m$(( (t1-t0)%60 ))s peak_used_mem=$(sort -n /tmp/mem.log | tail -1)MiB"
          echo "--- binary sizes reported by the builder stage ---"
          grep -a 'ZEROCLAW-BINSIZE' /tmp/build.log || echo "(no ZEROCLAW-BINSIZE markers in build log)"
          echo "--- release profile reported by the builder stage ---"
          grep -a 'ZEROCLAW-PROFILE' /tmp/build.log || echo "(no ZEROCLAW-PROFILE marker in build log)"
          echo "--- rustc command line proving the effective LTO mode ---"
          grep -aom1 -- '-C lto=[a-z]* -C codegen-units=[0-9]*' /tmp/build.log || echo "(no rustc lto flag found in build log)"
          echo "--- image size ---"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' zeroclaw-dist-broad:check || true
          exit $rc

      - name: channels list with a disposable Slack config
        if: matrix.platforms == 'linux/amd64'
        run: |
          mkdir -p /tmp/zc && chmod 777 /tmp/zc
          printf '[channels.slack.packaging-check]\nbot_token = "xoxb-0000000000-placeholder"\napp_token = "xapp-0-placeholder"\n' > /tmp/zc/config.toml
          docker run --rm -v /tmp/zc:/zeroclaw-data/.zeroclaw -e ZEROCLAW_CONFIG_DIR=/zeroclaw-data/.zeroclaw zeroclaw-dist-broad:check channels list
